name: 成都招聘日报

on:
  schedule:
    # 5轮搜索：北京时间 13:00 / 14:00 / 15:00 / 16:00 / 17:00 (UTC+8)
    # UTC 5:00 = 北京 13:00, UTC 6:00 = 北京 14:00, UTC 7:00 = 北京 15:00, UTC 8:00 = 北京 16:00, UTC 9:00 = 北京 17:00
    - cron: '0 5 * * *'    # 轮次1: 北京 13:00
    - cron: '0 6 * * *'    # 轮次2: 北京 14:00
    - cron: '0 7 * * *'    # 轮次3: 北京 15:00
    - cron: '0 8 * * *'    # 轮次4: 北京 16:00
    - cron: '0 9 * * *'    # 轮次5: 北京 17:00
    # 合并推送：北京时间 20:00 (UTC+8) = UTC 12:00
    - cron: '0 12 * * *'   # 轮次6: 北京 20:00 (合并5轮+推送)
  workflow_dispatch:
    inputs:
      round:
        description: '搜索轮次 (1-5搜索 / 6=合并推送 / 0=自动检测)'
        required: false
        default: '6'

jobs:
  collect-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: python -m playwright install chromium --with-deps

      - name: 执行招聘信息收集
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SEARCH_ROUND: ${{ github.event.inputs.round || '0' }}
        run: python main.py

      - name: 提交并推送结果
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 当前轮次（与main.py相同的逻辑）
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          ROUND="${{ github.event.inputs.round }}"
          if [ -z "$ROUND" ] || [ "$ROUND" = "0" ]; then
            if [ "$HOUR" -ge 13 ] && [ "$HOUR" -lt 14 ]; then
              ROUND=1
            elif [ "$HOUR" -ge 14 ] && [ "$HOUR" -lt 15 ]; then
              ROUND=2
            elif [ "$HOUR" -ge 15 ] && [ "$HOUR" -lt 16 ]; then
              ROUND=3
            elif [ "$HOUR" -ge 16 ] && [ "$HOUR" -lt 17 ]; then
              ROUND=4
            elif [ "$HOUR" -ge 17 ] && [ "$HOUR" -lt 18 ]; then
              ROUND=5
            elif [ "$HOUR" -ge 20 ]; then
              ROUND=6
            else
              ROUND=5
            fi
          fi

          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          git add reports/
          git diff --staged --quiet || git commit -m "招聘数据 轮次${ROUND} ${DATE}"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push
